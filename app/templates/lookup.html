{% extends "base.html" %}
{% block title %}Track an order — Ella Store{% endblock %}

{% block content %}
<section class="narrow">
  <h1>Track an order</h1>
  <p>Enter the order number you received after paying.</p>
  <form method="post" class="panel">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="order_no">Order number</label>
    <div class="inline">
      <input id="order_no" name="order_no" placeholder="EL261025A1B2C3" required autofocus>
      <button class="btn btn-primary" type="submit">Find order</button>
    </div>
  </form>
</section>
{% endblock %}
